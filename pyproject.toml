[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lab"
version = "0.1.0"
description = "Laboratorio educacional + industrial para construir y entrenar LLMs desde cero (Etapa 1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sebastian Torres", email = "sebastiantorres8800@gmail.com" }]
keywords = ["llm", "transformers", "deep-learning", "nlp", "education", "research"]

dependencies = [
    # Núcleo del pipeline (espejo de requirements.txt)
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "datasets>=3.0",
    "tokenizers>=0.20",
    "transformers>=4.45",
    "huggingface_hub>=0.25",
    "safetensors>=0.4",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "datasketch>=1.6",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Cuantización (requiere GPU NVIDIA; en Colab se instala automáticamente)
quant = ["bitsandbytes>=0.43"]
# Reducción de dimensionalidad avanzada y NLP extra
extra = [
    "umap-learn>=0.5",
    "sentencepiece>=0.2",
    "gensim>=4.3",
    "nltk>=3.8",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4",
    "bert-score>=0.3.13",
    "evaluate>=0.4",
    "datasketch>=1.6",       # MinHash para deduplicación
    "bertopic>=0.16",        # topic modeling (Fase 3)
]
# Desarrollo local
dev = [
    "jupyterlab>=4.1",
    "ipywidgets>=8.1",
    "pytest>=8.0",
    "ruff>=0.4",
    "nbformat>=5.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-v"
