# ──────────────────────────────────────────────────────────────────
# configs/domains.yaml — Léxico bilingüe (es/en) de los 26 dominios.
#
# El clasificador (llm_lab.data.domains) cuenta cuántos términos
# DISTINTOS de cada dominio aparecen en un documento. Un doc pasa el
# filtro si el total de términos distintos ≥ min_domain_hits y se le
# asigna el dominio con más coincidencias. Es un filtro léxico: barato,
# explicable y suficiente para recortar la web hacia tus temas
# (técnicos y también humanidades: filosofía y música).
# Términos en minúscula; se buscan con límites de palabra.
# ──────────────────────────────────────────────────────────────────

