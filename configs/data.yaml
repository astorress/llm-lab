# ──────────────────────────────────────────────────────────────────
# configs/data.yaml — Mezcla del corpus de PRE-ENTRENAMIENTO.
#
# Filosofía: un LLM pequeño especializado en el perfil de Sebastian
# (estadística, optimización y metaheurísticas, ciencia de datos y
# analítica, IA/LLMs, full stack, ML/DL, matemáticas, Python/datos/cloud,
# filosofía y música), bilingüe con sesgo al español.
#
#   · Fuentes LOCALES  → se usan completas y se repiten `repeat` veces
#                         (corpus personal: tesis MoE, notebooks, código).
#   · Fuentes HF       → se descargan en streaming y se filtran por
#                         dominio (léxico de configs/domains.yaml) hasta
#                         llenar `share · total_tokens`.
#
# La ponderación final se aplica en el DataLoader (muestreo por fuente),
# así que se puede re-balancear sin re-tokenizar.
# ──────────────────────────────────────────────────────────────────

profiles:
  tiny:  { total_tokens: 0,             sources: [personal, seed] }
  small: { total_tokens: 350_000_000,   sources: all }
  large: { total_tokens: 2_000_000_000, sources: all }

# Fracción del corpus que se reserva para validación (por hash del doc).
val_fraction: 0.005

sources:

  # ─── Locales ────────────────────────────────────────────────────
  personal:
    type: local_jsonl
    path: datasets/raw/personal/personal.jsonl   # scripts/collect_personal_corpus.py
    text_field: text
    lang: es
    repeat: 4              # ~4 épocas: es lo que más queremos que aprenda
    quality_filter: false  # incluye código y LaTeX propios

  seed:
    type: local_jsonl
    path: datasets/processed/corpus.jsonl        # scripts/build_corpus.py
    text_field: content
    domain_field: domain
    lang: es
    repeat: 8
    quality_filter: false

  # ─── Español ───────────────────────────────────────────────────
  wikipedia_es:
    type: hf
    path: wikimedia/wikipedia
    name: 20231101.es
    text_field: text
    title_field: title
    lang: es
    share: 0.20            # principal fuente de filosofía y música en español
    min_domain_hits: 4     # ≥4 términos distintos del léxico

  fineweb2_es:
    type: hf
    path: HuggingFaceFW/fineweb-2
    name: spa_Latn
    text_field: text
    lang: es
    share: 0.17
    min_domain_hits: 5     # web en español: filtro más estricto

  # ─── Inglés ────────────────────────────────────────────────────
  fineweb_edu:
    type: hf
    path: HuggingFaceFW/fineweb-edu
    name: sample-10BT
    text_field: text
    lang: en
    share: 0.20
    min_domain_hits: 4
    min_field: { int_score: 3 }   # solo texto "educativo" alto

  wikipedia_en:
    type: hf
    path: wikimedia/wikipedia
    name: 20231101.en
    text_field: text
    title_field: title
    lang: en
    share: 0.08
    min_domain_hits: 5

  cosmopedia:
    type: hf
    path: HuggingFaceTB/smollm-corpus
    name: cosmopedia-v2
    text_field: text
    lang: en
    share: 0.12             # libros de texto sintéticos: ideal para modelos chicos
    min_domain_hits: 3

  open_web_math:
    type: hf
    path: open-web-math/open-web-math
    text_field: text
    lang: en
    share: 0.08
    min_domain_hits: 0
    default_domain: matematicas
    quality_filter: false   # LaTeX tiene muchos símbolos

  arxiv:
    type: hf
    path: gfissore/arxiv-abstracts-2021
    text_field: abstract
    title_field: title
    lang: en
    share: 0.07
    min_domain_hits: 0
    quality_filter: false
    arxiv_categories:       # estadística, optimización/metaheurísticas, ML/IA/LLM, datos, web, música
      [math.ST, stat.TH, stat.ME, stat.AP, stat.CO, stat.ML, math.OC, cs.NE, cs.LG, cs.AI,
       cs.CL, cs.IR, cs.DB, cs.DC, cs.SE, cs.HC, cs.CY, cs.SD, eess.AS, physics.hist-ph]

  code_python:
    type: hf
    path: codeparrot/codeparrot-clean
    text_field: content
    lang: code
    share: 0.08
    min_domain_hits: 0
    default_domain: python
    quality_filter: false
    code_filter:
      max_line_max: 400
      min_alpha_frac: 0.3
      skip_autogenerated: true
      # Solo licencias permisivas (se excluye GPL/copyleft)
      allowed_licenses: [mit, apache-2.0, bsd-2-clause, bsd-3-clause, isc, unlicense, cc0-1.0]

# Límite de dominio dentro de cada fuente: ningún dominio puede superar
# esta fracción de los tokens de la fuente (evita que wikipedia_es se
# llene solo de "matemáticas").
max_domain_share: 0.30
