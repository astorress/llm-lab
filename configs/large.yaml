# ──────────────────────────────────────────────────────────────────
# configs/large.yaml — Perfil LARGE: A100 / L4 / RTX 4090 (24 GB+).
#
# ~100 M parámetros · ~2 B tokens (≈ 20 tokens/parámetro).
# Tokens por paso = 32·1024·8 = 262 144 → ~7 600 pasos.
# A100: ~3 h · RTX 4090 (RunPod/Vast): ~4–5 h.
# ──────────────────────────────────────────────────────────────────

profile: large
target_hardware: "NVIDIA A100 (40/80 GB) / L4 (24 GB) / RTX 4090 (24 GB)"

tokenizer:
  vocab_size: 32768
  sample_docs: 1000000

model:
  vocab_size: 32768
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4            # GQA: 3 queries por cada par K/V
  d_ff: 2048
  max_seq_len: 1024
  dropout: 0.0
  tie_embeddings: true
  positional: rope
  swiglu: true
  use_sdpa: true

training:
  batch_size: 32           # en L4 (24 GB) bajar a 16 y subir accum a 16
  gradient_accumulation_steps: 8
  max_steps: 7600
  eval_every_steps: 500
  eval_iters: 100
  checkpoint_every_steps: 500
  lr: 6.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  warmup_steps: 700
  scheduler: cosine
  grad_clip_norm: 1.0
  mixed_precision: bf16    # Ampere+ soporta bfloat16 nativo
  compile: true

finetuning:
  base_model: "Qwen/Qwen2.5-1.5B"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  use_qlora: true

evaluation:
  eval_batch_size: 64
  max_eval_samples: 5000
